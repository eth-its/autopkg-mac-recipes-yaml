Description: Downloads the latest version of GoToMeeting for Apple Silicon.
Identifier: com.github.eth-its-recipes.download.GoToMeeting-arm64
MinimumVersion: "2.3"

Input:
  NAME: GoToMeeting
  ARCH: arm64

Process:

  - Processor: URLDownloader
    Arguments:
      url: "https://goto-desktop.goto.com/GoTo-%ARCH%.dmg"

  - Processor: AppDmgVersioner
    Arguments:
      dmg_path: "%pathname%"

  - Processor: EndOfCheckPhase
