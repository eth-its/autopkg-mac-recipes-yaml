Description: Downloads the latest version of GoToMeeting for Intel.
Identifier: com.github.eth-its-recipes.download.GoToMeeting-x86_64
MinimumVersion: "2.3"

Input:
  NAME: GoToMeeting
  ARCH: x86_64

Process:

  - Processor: URLDownloader
    Arguments:
      url: "https://goto-desktop.goto.com/GoTo.dmg"

  - Processor: AppDmgVersioner
    Arguments:
      dmg_path: "%pathname%"

  - Processor: EndOfCheckPhase
