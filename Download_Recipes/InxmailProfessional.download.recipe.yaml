Description: Downloads the latest version of Inxmail Professional.
Identifier: com.github.eth-its-recipes.download.InxmailProfessional
MinimumVersion: 1.0.0

Input:
  NAME: Inxmail Professional

Process:
  - Processor: URLDownloader
    Arguments:
      filename: "%NAME%.dmg"
      url: "https://download.inxmail.com/data/release/inxmail/asp/Inxmail_Professional_Client_Asp_MacOsX.dmg"

  - Processor: EndOfCheckPhase

  - Processor: CodeSignatureVerifier
    Arguments:
      input_path: "%pathname%/Inxmail Professional.app"
      requirement: identifier "com.inxmail.login" and anchor apple generic and certificate 1[field.1.2.840.113635.100.6.2.6] /* exists */ and certificate leaf[field.1.2.840.113635.100.6.1.13] /* exists */ and certificate leaf[subject.OU] = U74N99KC5K

  - Processor: Versioner
    Arguments:
      plist_version_key: CFBundleShortVersionString
      input_plist_path: "%pathname%/Inxmail Professional.app/Contents/Info.plist"
