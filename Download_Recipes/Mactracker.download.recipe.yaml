Description: Downloads the current release version of Mactracker.
Identifier: com.github.eth-its-recipes.download.Mactracker
MinimumVersion: 0.3.1

Input:
  NAME: Mactracker
  SPARKLE_FEED_URL: "https://update.mactracker.ca/appcast-b.xml"

Process:
  - Processor: SparkleUpdateInfoProvider
    Arguments:
      appcast_url: "%SPARKLE_FEED_URL%"

  - Processor: URLDownloader
    Arguments:
      filename: "%NAME%.zip"

  - Processor: EndOfCheckPhase

  - Processor: Unarchiver
    Arguments:
      destination_path: "%RECIPE_CACHE_DIR%/%NAME%"
      purge_destination: true
      archive_path: "%pathname%"

  - Processor: CodeSignatureVerifier
    Arguments:
      requirement: identifier "com.mactrackerapp.Mactracker" and anchor apple generic and certificate 1[field.1.2.840.113635.100.6.2.6] /* exists */ and certificate leaf[field.1.2.840.113635.100.6.1.13] /* exists */ and certificate leaf[subject.OU] = "63TP32R3AB"
      input_path: "%RECIPE_CACHE_DIR%/%NAME%/Mactracker.app"
