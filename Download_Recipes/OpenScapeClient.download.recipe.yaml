Description: Download recipe for the polybox desktop client.
Identifier: com.github.eth-its-recipes.download.OpenScapeClient
MinimumVersion: "2.3"

Input:
  NAME: OpenScape Client

Process:
  - Processor: URLDownloader
    Comment: Download the setup package (note that the package is not signed)
    Arguments:
      # url: "https://polybox.ethz.ch/index.php/s/p47WGtTrBOGsbyE/download"
      url: "https://polybox.ethz.ch/public.php/dav/files/SSYPpH1iWskH5HE/UCDesktopAppSetup.pkg?accept=pkg"
      # url: "https://polybox.ethz.ch/index.php/s/MWRigmraH2kQgPi/download"
      filename: UCDesktopAppSetup.pkg

  - Processor: EndOfCheckPhase
