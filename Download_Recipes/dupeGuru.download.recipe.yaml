Description: Download recipe for dupeGuru.
Identifier: com.github.eth-its-recipes.download.dupeGuru
MinimumVersion: "2.3"

Input:
  NAME: dupeGuru

Process:
  - Processor: GitHubReleasesInfoProvider
    Arguments:
      github_repo: arsenetar/dupeguru
      asset_regex: .*_macOS_Qt_.*zip$

  - Processor: URLDownloader
    Arguments:
      filename: "%NAME%-%version%.zip"

  - Processor: EndOfCheckPhase

  - Processor: Unarchiver
    Arguments:
      archive_path: "%pathname%"
      destination_path: "%RECIPE_CACHE_DIR%/unzip"
      purge_destination: true