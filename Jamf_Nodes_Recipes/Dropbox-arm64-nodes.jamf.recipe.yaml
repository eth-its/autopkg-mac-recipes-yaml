Description: Creates a Self-Service Policy available to members of a Testing group.
Identifier: com.github.eth-its-recipes.jamf.Dropbox-arm64-nodes
ParentRecipe: com.github.eth-its-recipes.jamf.template-platform-script-nodes
MinimumVersion: "2.3"

Input:
  NAME: Dropbox
  PLATFORM: arm64
  UNTESTED_RECIPE_IDENTIFIER: local.jamf.Dropbox-arm64
  SELFSERVICE_ICON: Dropbox 129.png
  POLICY_NAME: "%NAME% %PLATFORM% (Testing)"
  SELFSERVICE_DISPLAY_NAME: "%NAME% %PLATFORM% (Testing)"
  TEST_VERSION_INSTALLED_GROUP_NAME: "%NAME% %PLATFORM% test version installed"
  POLICY_RUN_COMMAND: "echo 'Installation of %NAME% %PLATFORM% complete'"
  POLICY_TEMPLATE: Policy-untested-selfservice-platform-script.xml
  PLATFORM_EXCLUSION_GROUP_NAME: "Intel Mac"
  PLATFORM_EXCLUSION: x86_64
  PLATFORM_EXCLUSION_GROUP_TEMPLATE: SmartGroup-platform.xml
  SCRIPT_NAME: "%NAME%-postinstall.sh"
  SCRIPT_PATH: "%NAME%-postinstall.sh"
  SCRIPT_PRIORITY: After
