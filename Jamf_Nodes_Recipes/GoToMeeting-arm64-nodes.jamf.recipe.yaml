  ARCH: arm64
  PLATFORM: "%ARCH%"
  PLATFORM_EXCLUSION_GROUP_NAME: "Intel Mac"
  PLATFORM_EXCLUSION: x86_64
  PLATFORM_EXCLUSION_GROUP_TEMPLATE: SmartGroup-platform.xml
  UNTESTED_RECIPE_IDENTIFIER: local.jamf.GoToMeeting-arm64
  JSS_INVENTORY_NAME: "GoTo.app"
  SP_EXECUTABLE_COMMAND: "open /Applications/GoTo.app"
  SP_PROCESS_NAME: GoTo