Description: Creates a Self-Service Policy available to members of a Testing group.
Identifier: com.github.eth-its-recipes.jamf.Opera-arm64-nodes
ParentRecipe: com.github.eth-its-recipes.jamf.template-platform-EA-nodes
MinimumVersion: "2.3"

Input:
  NAME: Opera
  UNTESTED_RECIPE_IDENTIFIER: local.jamf.Opera
  EXTENSION_ATTRIBUTE_NAME: Opera Version
  EXTENSION_ATTRIBUTE_SCRIPT: VersionStringOverride-EA.sh
  JSS_INVENTORY_NAME: "%NAME%.app"
  VERSION_STRING_TYPE: CFBundleVersion
  PLATFORM: arm64
  ARCH: "%PLATFORM%"
  PLATFORM_EXCLUSION_GROUP_NAME: "Intel Mac"
  PLATFORM_EXCLUSION: x86_64
  PLATFORM_EXCLUSION_GROUP_TEMPLATE: SmartGroup-platform.xml