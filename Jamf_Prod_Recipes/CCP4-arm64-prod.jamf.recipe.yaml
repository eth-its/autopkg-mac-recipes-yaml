Description: Creates all production policies for a particular title.
Identifier: com.github.eth-its-recipes.jamf.CCP4-arm64-prod
MinimumVersion: "2.3"
ParentRecipe: com.github.eth-its-recipes.jamf.template-preset-platform-prod-no-users

Input:
  NAME: CCP4
  UNTESTED_RECIPE_IDENTIFIER: local.jamf.CCP4-arm64
  PLATFORM: arm64
  PLATFORM_EXCLUSION_GROUP_NAME: "Intel Mac"
  PLATFORM_EXCLUSION: x86_64
  
  TRIGGER_POLICY_TEMPLATE: Policy-prod-triggeronly-script.xml
  EXTENSION_ATTRIBUTE_NAME: "CCP4 version"
  EXTENSION_ATTRIBUTE_SCRIPT: CCP4-EA.zsh

  PROD_VERSION_INSTALLED_GROUP_TEMPLATE: SmartGroup-prod-version-installed-EA-no-users-platform.xml

  EXTENSION_ATTRIBUTE_SEARCH_TYPE: does not match regex
  EXTENSION_ATTRIBUTE_VALUE: ^None$|^$

  SCRIPT_PATH: CCP4-postinstall.sh
  SCRIPT_NAME: CCP4-postinstall.sh
  SCRIPT_CATEGORY:  Science & Math
  SCRIPT_PRIORITY: After
  SELFSERVICE_ICON: "%NAME%.png"
