Description: Creates all production policies for a particular title.
Identifier: com.github.eth-its-recipes.jamf.Dropbox-arm64-prod
MinimumVersion: "2.3"
ParentRecipe: com.github.eth-its-recipes.jamf.template-preset-platform-prod-no-users

Input:
  NAME: Dropbox
  PLATFORM: arm64
  PLATFORM_EXCLUSION: x86_64
  PLATFORM_EXCLUSION_GROUP_NAME: "Intel Mac"
  PLATFORM_EXCLUSION_GROUP_TEMPLATE: SmartGroup-platform.xml
  UNTESTED_RECIPE_IDENTIFIER: local.jamf.Dropbox-arm64
  SCRIPT_NAME: "%NAME%-postinstall.sh"
  SCRIPT_PATH: "%NAME%-postinstall.sh"
  SCRIPT_PRIORITY: After
  TRIGGER_POLICY_TEMPLATE: Policy-prod-triggeronly-script.xml
  SELFSERVICE_ICON: Dropbox 129.png
