Description: Creates all production policies for a particular title.
Identifier: com.github.eth-its-recipes.jamf.FileZilla-x86_64-prod
MinimumVersion: "2.3"
ParentRecipe: com.github.eth-its-recipes.jamf.template-preset-platform-prod-no-users

Input:
  NAME: FileZilla
  UNTESTED_RECIPE_IDENTIFIER: local.jamf.FileZilla-x86_64
  PLATFORM_EXCLUSION_GROUP_NAME: "Apple Silicon Mac"
  PLATFORM_EXCLUSION: arm64
  PLATFORM: x86_64
  INSTALLED_GROUP_NAME: "%NAME% %PLATFORM% installed"
  INSTALLED_GROUP_TEMPLATE: SmartGroup-installed-platform-no-users.xml  
  TRIGGER_POLICY_NAME: "Install %NAME% %PLATFORM%"
  TRIGGER_POLICY_RUN_COMMAND: "echo 'Installation of %NAME% %PLATFORM% complete'"