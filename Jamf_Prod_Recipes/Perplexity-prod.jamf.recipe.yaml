Description: Creates all production policies for a particular title.
Identifier: com.github.eth-its-recipes.jamf.Perplexity-prod
MinimumVersion: "2.3"
ParentRecipe: com.github.eth-its-recipes.jamf.template-preset-prod

Input:
  NAME: Perplexity
  JSS_INVENTORY_NAME: "%NAME%.app"
  UNTESTED_RECIPE_IDENTIFIER: local.jamf.Perplexity
  PROD_VERSION_INSTALLED_GROUP_TEMPLATE: SmartGroup-prod-version-installed-no-users.xml
  INSTALLED_GROUP_TEMPLATE: SmartGroup-installed-no-users.xml
  SELFSERVICE_POLICY_TEMPLATE: Policy-prod-selfservice-install-forcedescription.xml
  SP_PROCESS_NAME: Perplexity
  SP_EXECUTABLE_COMMAND: open '/Applications/Perplexity.app'