Description: |
  Uploads a script to the Jamf Pro Server and creates a Self Service Policy and Smart Group.
  Script installs a printer, credentials will be asked once the first job is sent by the user.

Identifier: com.github.eth-its-recipes.jamf.ETHPrinters-card-hp-ipps-script
MinimumVersion: "2.3"

Input:
  NAME: "ETH Follow-Me Printer (%PRINTER_NAME%)"
  POLICY_CATEGORY: ETH
  TEST_USERS_GROUP_NAME: Testing
  TESTING_GROUP_TEMPLATE: SmartGroup-test-users.xml
  POLICY_NAME: "%NAME%"
  PRINTER_NAME: "card-hp"
  INSTALLED_GROUP_NAME: "%NAME% installed"
  GROUP_NAME: "%INSTALLED_GROUP_NAME%"
  TEST_VERSION_INSTALLED_GROUP_NAME: "%INSTALLED_GROUP_NAME%"
  INSTALLED_GROUP_TEMPLATE: SmartGroup-generic-EA.xml # SmartGroup-MappedPrinters-installed.xml
  EXTENSION_ATTRIBUTE_SEARCH_TYPE: "like"
  EXTENSION_ATTRIBUTE_VALUE: "/%PRINTER_NAME%/auth"

  SELFSERVICE_POLICY_CATEGORY: ETH
  SELFSERVICE_POLICY_TEMPLATE: Policy-prod-selfservice-install.xml
  SELFSERVICE_DISPLAY_NAME: "%NAME%"
  SELFSERVICE_DESCRIPTION: "Install the **%PRINTER_NAME%** print queue along with any required drivers. \n\nUser Credentials must be provided and saved once the first print Job is sent: ETH username, and email password. \nJobs will start printing once you present your ETH card to the printer, and release the job."
  SELFSERVICE_ICON: "ETH Printers.png"
  SELFSERVICE_POLICY_NAME: "%NAME%"
  INSTALL_BUTTON_TEXT: Install
  REINSTALL_BUTTON_TEXT: Install
  FORCE_DESCRIPTION: "false"

  POLICY_RUN_COMMAND: "jamf policy -event \"%TRIGGER_NAME%\""
  TRIGGER_POLICY_CATEGORY: Triggered Installers
  TRIGGER_POLICY_TEMPLATE: Policy-script-triggeronly.xml
  TRIGGER_POLICY_NAME: "Install %NAME%"
  TRIGGER_NAME: "%PRINTER_NAME%-ipps-install"
  TRIGGER_POLICY_RUN_COMMAND: "echo 'Installation of %NAME% complete'"
  MESSAGE_FINISH: "%NAME% installation complete"

  AUTOINSTALL_GROUP_NAME: "%NAME% auto-install"
  AUTOINSTALL_POLICY_NAME: "Auto-install %NAME%"
  AUTOINSTALL_GROUP_TEMPLATE: SmartGroup-autoinstall-no-users.xml
  AUTOINSTALL_POLICY_TEMPLATE: Policy-prod-autoinstall.xml
  AUTOINSTALL_POLICY_CATEGORY: Auto-installers
  AUTOINSTALL_POLICY_FREQUENCY: Once every day

  SCRIPT_NAME: ETHPrinterTemplate-ipps.sh
  SCRIPT_PRIORITY: After
  PARAMETER4_LABEL: Server
  PARAMETER5_LABEL: Printer Name
  PARAMETER6_LABEL: GUI Display Name
  PARAMETER7_LABEL: Location (optional)
  PARAMETER8_LABEL: Driver File (eg HP Color MFP E87640-50-60.gz/RICOH MP C5503)
  PARAMETER9_LABEL: Driver options (-o x=xx -o y=yy -o z=zz)
  PARAMETER10_LABEL: Default Printer (1 = yes)
  PARAMETER11_LABEL: Parameter 11
  PARAMETER4_VALUE: "pia01.d.ethz.ch"
  PARAMETER5_VALUE: "%PRINTER_NAME%"
  PARAMETER6_VALUE: "%PRINTER_NAME%"
  PARAMETER7_VALUE: "Print anywhere at ETH using your ETH card"
  PARAMETER8_VALUE: HP Color MFP E87640-50-60.gz
  PARAMETER9_VALUE: "-o HPOption_OutputBin=HP3BinMailbox -o HPOption_BookletMaker=True -o HPOption_HPFoldingOptions=MultiFold -o HPOption_HPStaplerOptions=HP2StapleUnit -o HPOption_HPPunchingOptions=HP24HolesUnit -o HPOption_Tray4=HP520SheetInputTray -o HPOption_Tray5=HP520SheetInputTray -o HPOption_Tray6=HP3000SheetInputTray -o HPColorAsGray=BlackInkOnly -o MediaType=Plain -o PageRegion=A4 -o ImageableArea=A4 -o PaperDimension=A4 -o HPBookletPageSize=A4"
  PARAMETER10_VALUE: "1"
  PARAMETER11_VALUE: " "

  EXTENSION_ATTRIBUTE_NAME: "Installed Printers"
  EXTENSION_ATTRIBUTE_SCRIPT: "InstalledPrinters-EA.zsh"

  SELFSERVICE_UNINSTALL_POLICY_RUN_COMMAND: "lpadmin -x '%PRINTER_NAME%'"
  UNINSTALL_SELFSERVICE_INSTALL_BUTTON: "Uninstall"
  UNINSTALL_SELFSERVICE_REINSTALL_BUTTON: "Uninstall"
  UNINSTALL_SELFSERVICE_DISPLAY_NAME: "Uninstall %NAME%"
  UNINSTALL_POLICY_NAME: "%UNINSTALL_SELFSERVICE_DISPLAY_NAME%"
  UNINSTALL_SELFSERVICE_DESCRIPTION: "Removes %NAME%"
  SELFSERVICE_FORCE_DESCRIPTION: "False"
  UNINSTALL_POLICY_CATEGORY: "%POLICY_CATEGORY%"

Process:
  - Processor: com.github.grahampugh.jamf-upload.processors/JamfCategoryUploader
    Arguments:
      category_name: "%SELFSERVICE_POLICY_CATEGORY%"

  - Processor: com.github.grahampugh.jamf-upload.processors/JamfCategoryUploader
    Arguments:
      category_name: "%TRIGGER_POLICY_CATEGORY%"

  - Processor: com.github.grahampugh.jamf-upload.processors/JamfScriptUploader
    Arguments:
      script_category: "%POLICY_CATEGORY%"
      script_path: "%SCRIPT_NAME%"
      script_priority: "%SCRIPT_PRIORITY%"
      script_parameter4: "%PARAMETER4_LABEL%"
      script_parameter5: "%PARAMETER5_LABEL%"
      script_parameter6: "%PARAMETER6_LABEL%"
      script_parameter7: "%PARAMETER7_LABEL%"
      script_parameter8: "%PARAMETER8_LABEL%"
      script_parameter9: "%PARAMETER9_LABEL%"
      script_parameter10: "%PARAMETER10_LABEL%"
      script_parameter11: "%PARAMETER11_LABEL%"
      replace_script: "True"

  - Processor: com.github.grahampugh.jamf-upload.processors/JamfComputerGroupUploader
    Arguments:
      computergroup_template: "%TESTING_GROUP_TEMPLATE%"
      computergroup_name: "%TESTING_GROUP_NAME%"
      replace_group: "False"

  - Processor: com.github.grahampugh.jamf-upload.processors/JamfExtensionAttributeUploader
    Arguments:
      ea_script_path: "%EXTENSION_ATTRIBUTE_SCRIPT%"
      ea_name: "%EXTENSION_ATTRIBUTE_NAME%"
      replace_ea: "True"

  - Processor: com.github.grahampugh.jamf-upload.processors/JamfComputerGroupUploader
    Arguments:
      computergroup_name: "%INSTALLED_GROUP_NAME%"
      computergroup_template: "%INSTALLED_GROUP_TEMPLATE%"
      replace_group: "True"

  - Processor: com.github.grahampugh.jamf-upload.processors/JamfPolicyUploader
    Comment: Trigger-only policy
    Arguments:
      policy_template: "%TRIGGER_POLICY_TEMPLATE%"
      policy_name: "%TRIGGER_POLICY_NAME%"
      icon: ""
      replace_policy: "True"

  - Processor: com.github.grahampugh.jamf-upload.processors/JamfPolicyUploader
    Comment: Self Service install policy
    Arguments:
      policy_template: "%SELFSERVICE_POLICY_TEMPLATE%"
      policy_name: "%SELFSERVICE_POLICY_NAME%"
      icon: "%SELFSERVICE_ICON%"
      USERS_GROUP_NAME: "%TESTING_GROUP_NAME%"
      replace_policy: "True"

  - Processor: com.github.grahampugh.jamf-upload.processors/JamfComputerGroupUploader
    Arguments:
      computergroup_name: "%AUTOINSTALL_GROUP_NAME%"
      computergroup_template: "%AUTOINSTALL_GROUP_TEMPLATE%"
      replace_group: "False"

  - Processor: com.github.grahampugh.jamf-upload.processors/JamfPolicyUploader
    Comment: Auto-install policy
    Arguments:
      policy_template: "%AUTOINSTALL_POLICY_TEMPLATE%"
      policy_name: "%AUTOINSTALL_POLICY_NAME%"
      icon: ""
      replace_policy: "True"

  - Processor: com.github.grahampugh.jamf-upload.processors/JamfPolicyUploader
    Comment: Self Service uninstall policy
    Arguments:
      policy_template: Policy-uninstall-selfservice-command.xml
      policy_name: "%UNINSTALL_POLICY_NAME%"
      replace_policy: "True"
      icon: "%SELFSERVICE_ICON%"