Description: |
  Uploads a script to the Jamf Pro Server and creates a Self Service Policy and Smart Group.

Identifier: com.github.eth-its-recipes.jamf.ETHPrinters-card-hp-testing-script
MinimumVersion: "2.3"

Input:
  NAME: ETH Printers - card-hp (testing)
  POLICY_CATEGORY: ETH
  TEST_USERS_GROUP_NAME: Testing
  TESTING_GROUP_TEMPLATE: SmartGroup-test-users.xml
  POLICY_NAME: "%NAME%"
  INSTALLED_GROUP_NAME: "%NAME% installed"
  GROUP_NAME: "%INSTALLED_GROUP_NAME%"
  TEST_VERSION_INSTALLED_GROUP_NAME: "%INSTALLED_GROUP_NAME%"
  INSTALLED_GROUP_TEMPLATE: SmartGroup-generic-EA.xml # SmartGroup-MappedPrinters-installed.xml
  EXTENSION_ATTRIBUTE_SEARCH_TYPE: "like"
  EXTENSION_ATTRIBUTE_VALUE: "/card-hp/auth"
  SELFSERVICE_POLICY_CATEGORY: ETH
  SELFSERVICE_POLICY_TEMPLATE: Policy-untested-selfservice.xml
  POLICY_RUN_COMMAND: "jamf policy -event \"%TRIGGER_NAME%\""
  SELFSERVICE_POLICY_NAME: "%NAME%"
  TRIGGER_POLICY_CATEGORY: Triggered Installers
  TRIGGER_POLICY_TEMPLATE: Policy-script-triggeronly.xml
  TRIGGER_POLICY_NAME: "Install %NAME%"
  TRIGGER_NAME: card-hp-install-testing
  TRIGGER_POLICY_RUN_COMMAND: "echo 'Installation of %NAME% complete'"
  MESSAGE_FINISH: "%NAME% installation complete"
  SCRIPT_NAME: ETHPrinter-Ipptest.sh
  SCRIPT_PRIORITY: After
  SELFSERVICE_DISPLAY_NAME: "%NAME%"
  SELFSERVICE_DESCRIPTION: Install the card-hp print queue along with any required drivers.
  SELFSERVICE_ICON: ETH Printers.png
  INSTALL_BUTTON_TEXT: Install
  REINSTALL_BUTTON_TEXT: Install
  FORCE_DESCRIPTION: "false"
  EXTENSION_ATTRIBUTE_NAME: "Installed Printers"
  EXTENSION_ATTRIBUTE_SCRIPT: "InstalledPrinters-EA.zsh"

Process:
  - Processor: com.github.grahampugh.jamf-upload.processors/JamfCategoryUploader
    Arguments:
      category_name: "%SELFSERVICE_POLICY_CATEGORY%"

  - Processor: com.github.grahampugh.jamf-upload.processors/JamfCategoryUploader
    Arguments:
      category_name: "%TRIGGER_POLICY_CATEGORY%"

  - Processor: com.github.grahampugh.jamf-upload.processors/JamfScriptUploader
    Arguments:
      script_category: "%POLICY_CATEGORY%"
      script_path: "%SCRIPT_NAME%"
      replace_script: "True"

  - Processor: com.github.grahampugh.jamf-upload.processors/JamfComputerGroupUploader
    Arguments:
      computergroup_template: "%TESTING_GROUP_TEMPLATE%"
      computergroup_name: "%TESTING_GROUP_NAME%"
      replace_group: "False"

  - Processor: com.github.grahampugh.jamf-upload.processors/JamfExtensionAttributeUploader
    Arguments:
      ea_script_path: "%EXTENSION_ATTRIBUTE_SCRIPT%"
      ea_name: "%EXTENSION_ATTRIBUTE_NAME%"
      replace_ea: "True"

  - Processor: com.github.grahampugh.jamf-upload.processors/JamfComputerGroupUploader
    Arguments:
      computergroup_name: "%INSTALLED_GROUP_NAME%"
      computergroup_template: "%INSTALLED_GROUP_TEMPLATE%"
      replace_group: "True"

  - Processor: com.github.grahampugh.jamf-upload.processors/JamfPolicyUploader
    Comment: Trigger-only policy
    Arguments:
      policy_template: "%TRIGGER_POLICY_TEMPLATE%"
      policy_name: "%TRIGGER_POLICY_NAME%"
      icon: ""
      replace_policy: "True"

  - Processor: com.github.grahampugh.jamf-upload.processors/JamfPolicyUploader
    Comment: Self Service install policy
    Arguments:
      policy_template: "%SELFSERVICE_POLICY_TEMPLATE%"
      policy_name: "%SELFSERVICE_POLICY_NAME%"
      icon: "%SELFSERVICE_ICON%"
      replace_policy: "True"
