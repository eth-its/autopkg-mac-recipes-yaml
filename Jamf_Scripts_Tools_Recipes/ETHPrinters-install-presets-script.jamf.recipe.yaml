Description: |
  Uploads a script to the Jamf Pro Server and creates a Self Service Policy.

Identifier: com.github.eth-its-recipes.jamf.ETHPrinters-install-presets
MinimumVersion: "2.3"

Input:
  NAME: ETH Printers - Install Presets
  POLICY_CATEGORY: ETH
  TEST_USERS_GROUP_NAME: Testing
  TESTING_GROUP_TEMPLATE: SmartGroup-test-users.xml
  POLICY_NAME: "%NAME%"

  SELFSERVICE_POLICY_CATEGORY: ETH
  SELFSERVICE_POLICY_TEMPLATE: Policy-prod-selfservice-all-computers-noexclusions-runscript.xml
  SELFSERVICE_DISPLAY_NAME: "%NAME%"
  SELFSERVICE_DESCRIPTION: |
    Installs four Printing Presets for all Printers. Use "B/W Double-sided - ETH Default" to minimise environmental impact. 

    To use these presets, print using the system dialogue - Google Chrome and derivates, Adobe applications etc. have to be explicitly told to do so.\n\n

    | Preset Name | Properties |
    |------------|------------|
    | B/W Double-sided | Prints on both sides of the page, and reduces color content to black and white. |
    | B/W Single-sided | Prints on one side of the page only, and reduces color content to black and white. |
    | Colour Double-sided | Prints on both sides of the page. Costs more per page than black and white. |
    | Colour Single-sided | Prints on one side of the page only. Costs more per page than black and white. |


  SELFSERVICE_ICON: "ETH Printers.png"
  SELFSERVICE_POLICY_NAME: "%NAME%"
  INSTALL_BUTTON_TEXT: Install Presets
  REINSTALL_BUTTON_TEXT: Install Presets
  FORCE_DESCRIPTION: "false"

  SCRIPT_NAME: ETHPrinters-InstallPresets.sh
  SCRIPT_PRIORITY: After


Process:
  - Processor: com.github.grahampugh.jamf-upload.processors/JamfCategoryUploader
    Arguments:
      category_name: "%SELFSERVICE_POLICY_CATEGORY%"


  - Processor: com.github.grahampugh.jamf-upload.processors/JamfScriptUploader
    Arguments:
      script_category: "%POLICY_CATEGORY%"
      script_path: "%SCRIPT_NAME%"
      replace_script: "True"

  - Processor: com.github.grahampugh.jamf-upload.processors/JamfComputerGroupUploader
    Arguments:
      computergroup_template: "%TESTING_GROUP_TEMPLATE%"
      computergroup_name: "%TESTING_GROUP_NAME%"
      replace_group: "False"

  - Processor: com.github.grahampugh.jamf-upload.processors/JamfPolicyUploader
    Comment: Self Service install policy
    Arguments:
      policy_template: "%SELFSERVICE_POLICY_TEMPLATE%"
      policy_name: "%SELFSERVICE_POLICY_NAME%"
      icon: "%SELFSERVICE_ICON%"
      USERS_GROUP_NAME: "%TESTING_GROUP_NAME%"
      replace_policy: "True"