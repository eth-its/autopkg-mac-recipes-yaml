Description: Uploads a script to the Jamf Pro Server and creates a Self Service Policy and Smart Group.
Identifier: com.github.eth-its-recipes.jamf.CCP4-arm64-uninstall
MinimumVersion: "2.3"
ParentRecipe: com.github.eth-its-recipes.jamf.template-script-uninstall-platform-no-users

Input:
  NAME: CCP4
  PLATFORM: arm64

  SELFSERVICE_DESCRIPTION: "Uninstalls %NAME% %PLATFORM%"
  PARAMETER5_LABEL: Package Receipt
  PARAMETER5_VALUE: ch.ethz.id.pkg.ccp4
  PARAMETER4_VALUE: None
  PARAMETER6_VALUE: None
  PARAMETER7_VALUE: None
  PARAMETER8_VALUE: None
  PARAMETER9_VALUE: None
  PARAMETER10_VALUE: None
  PARAMETER11_VALUE: None

  TRIGGER_UNINSTALL_POLICY_TEMPLATE: Policy-uninstall-triggeronly-script-parameters-runcommand.xml
  TRIGGER_UNINSTALL_POLICY_RUN_COMMAND: "rm -rf /Applications/ccp4-*/ ; echo 'Uninstall of CCP4 complete'"

  EXTENSION_ATTRIBUTE_NAME: "CCP4 version"
  EXTENSION_ATTRIBUTE_SCRIPT: CCP4-EA.zsh
  EXTENSION_ATTRIBUTE_SEARCH_TYPE: does not match regex
  EXTENSION_ATTRIBUTE_VALUE: "^None$|^$"
  INSTALLED_GROUP_TEMPLATE: SmartGroup-installed-EA-platform-no-users.xml

