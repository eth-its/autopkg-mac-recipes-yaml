  INSTALLED_GROUP_TEMPLATE: SmartGroup-installed-has.xml
  APPLICATION_NAME_HAS: "%NAME%"
  SCRIPT_NAME: Topspin5-uninstall.sh
  SCRIPT_PATH: Topspin5-uninstall.sh