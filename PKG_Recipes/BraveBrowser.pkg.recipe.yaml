Description: Downloads latest Brave Browser installer and uses it to create a package.
Identifier: com.github.eth-its-recipes.pkg.BraveBrowser
MinimumVersion: "2.3"
ParentRecipe: com.github.eth-its-recipes.download.BraveBrowser

Input:
  NAME: Brave Browser

Process:
  - Processor: AppPkgCreator
    Arguments:
      pkg_path: "%RECIPE_CACHE_DIR%/%NAME%-%version%.pkg"
      app_path: "%pathname%/%NAME%.app"
