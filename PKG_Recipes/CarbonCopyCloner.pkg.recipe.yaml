Description: Downloads the current release version of CarbonCopyCloner and builds a package.
Identifier: com.github.eth-its-recipes.pkg.CarbonCopyCloner
MinimumVersion: "2.3"
ParentRecipe: com.github.eth-its-recipes.download.CarbonCopyCloner

Input:
  NAME: CarbonCopyCloner

Process:
  - Arguments:
      pkgdirs:
        Applications: "0775"
      pkgroot: "%RECIPE_CACHE_DIR%/%NAME%"
    Processor: PkgRootCreator
  - Arguments:
      archive_path: "%pathname%"
      destination_path: "%pkgroot%/Applications"
      purge_destination: true
    Processor: Unarchiver
  - Arguments:
      input_plist_path: "%pkgroot%/Applications/Carbon Copy Cloner.app/Contents/Info.plist"
      plist_version_key: CFBundleShortVersionString
    Comment: Get version from the app
    Processor: Versioner
  - Arguments:
      pkg_request:
        chown:
          - group: admin
            path: Applications
            user: root
        id: com.bombich.ccc
        options: purge_ds_store
        pkgname: "%NAME%-%version%"
        version: "%version%"
    Processor: PkgCreator
