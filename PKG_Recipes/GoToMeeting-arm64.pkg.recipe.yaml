Description: Downloads the latest version of GoToMeeting for Apple Silicon and creates a package.
Identifier: com.github.eth-its-recipes.pkg.GoToMeeting-arm64
ParentRecipe: com.github.eth-its-recipes.download.GoToMeeting-arm64
MinimumVersion: 1.0.0

Input:
  NAME: GoToMeeting
  ARCH: arm64
  PLATFORM: "%ARCH%"

Process:
  - Processor: AppPkgCreator
    Arguments:
      pkg_path: "%RECIPE_CACHE_DIR%/%NAME%-%PLATFORM%-%version%.pkg"
