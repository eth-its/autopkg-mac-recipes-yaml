Description: Downloads the latest version of GoToMeeting for Intel and creates a package.
Identifier: com.github.eth-its-recipes.pkg.GoToMeeting-x86_64
ParentRecipe: com.github.eth-its-recipes.download.GoToMeeting-x86_64
MinimumVersion: 1.0.0

Input:
  NAME: GoToMeeting
  ARCH: x86_64
  PLATFORM: "%ARCH%"

Process:
  - Processor: AppPkgCreator
    Arguments:
      pkg_path: "%RECIPE_CACHE_DIR%/%NAME%-%PLATFORM%-%version%.pkg"
