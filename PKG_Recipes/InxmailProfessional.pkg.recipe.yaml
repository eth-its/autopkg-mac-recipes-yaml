Description: Downloads the latest version of Inxmail Professional and creates a package.
Identifier: com.github.eth-its-recipes.pkg.InxmailProfessional
ParentRecipe: com.github.eth-its-recipes.download.InxmailProfessional
MinimumVersion: 1.0.0

Input:
  NAME: Inxmail Professional

Process:
  - Processor: AppPkgCreator
    Arguments:
      pkg_path: "%RECIPE_CACHE_DIR%/%NAME%-%version%.pkg"
      app_path: "%pathname%/%NAME%.app"