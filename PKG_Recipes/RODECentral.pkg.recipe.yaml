Description: Downloads the current release version of RODE Central and builds a package.
Identifier: com.github.eth-its-recipes.pkg.RODECentral
ParentRecipe: com.github.eth-its-recipes.download.RODECentral
MinimumVersion: 0.2.0

Input:
  NAME: RODECentral

Process:
  - Processor: FlatPkgUnpacker
    Arguments:
      flat_pkg_path: "%RECIPE_CACHE_DIR%/RodeCentral.pkg"
      destination_path: "%RECIPE_CACHE_DIR%/pkgextract"
      purge_destination: True

  - Processor: PkgPayloadUnpacker
    Arguments:
      destination_path: "%RECIPE_CACHE_DIR%/pkgextract2"
      pkg_payload_path: "%RECIPE_CACHE_DIR%/pkgextract/RodeCentral.pkg/Payload"
      purge_destination: True

  - Processor: Versioner 
    Arguments:
      input_plist_path: "%RECIPE_CACHE_DIR%/pkgextract2/Applications/RODE Central.app/Contents/Info.plist"
  
  - Processor: PkgCopier
    Arguments:
      pkg_path: "%RECIPE_CACHE_DIR%/RodeCentral-%version%.pkg"
      source_pkg: "%RECIPE_CACHE_DIR%/unzip/R*DE Central*.pkg"

  - Processor: PathDeleter
    Arguments:
      path_list: 
            - "%RECIPE_CACHE_DIR%/RodeCentral.pkg"
            - "%RECIPE_CACHE_DIR%/pkgextract"
            - "%RECIPE_CACHE_DIR%/pkgextract2"
            - "%RECIPE_CACHE_DIR%/unzip"