Description: Downloads the latest version of Topspin and creates a payloadless package. This recipe works for TopSpin 5
Identifier: com.github.eth-its-recipes.pkg.TopSpin
ParentRecipe: com.github.eth-its-recipes.download.TopSpin
MinimumVersion: "2.3"

Input:
  NAME: TopSpin

Process:
  - Processor: PkgRootCreator
    Arguments:
      pkgdirs: {}
      pkgroot: "%RECIPE_CACHE_DIR%/pkgroot"

  - Processor: PkgRootCreator
    Arguments:
      pkgdirs: {}
      pkgroot: "%RECIPE_CACHE_DIR%/Scripts"
    
  - Processor: FileCreator
    Arguments:
      file_content: |
        #!/bin/bash
        ## script to install topspin in x86_64
        DIR=$(dirname "$0")
        arch -x86_64 /usr/sbin/installer -pkg "$DIR/TopSpin_%version%.pkg" -target /
        exit 0
      file_mode: "0755"
      file_path: "%RECIPE_CACHE_DIR%/Scripts/postinstall"
    
  - Processor: Copier
    Arguments:
      source_path: "%pathname%"
      destination_path: "%RECIPE_CACHE_DIR%/Scripts/TopSpin_%version%.pkg"
      overwrite: True

  - Processor: PkgCreator
    Arguments:
      force_pkg_build: True
      pkg_request:
        chown: []
        id: ch.ethz.topspin%version%.pkg
        pkgname: "%NAME%-%version%"
        pkgroot: "%RECIPE_CACHE_DIR%/pkgroot"
        pkgtype: flat
        scripts: "%RECIPE_CACHE_DIR%/Scripts"
        version: "%version%"
    
