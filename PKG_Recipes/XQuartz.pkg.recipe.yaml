Description: Uses parent pkg recipe to download latest XQuartz and assigns correct version number.
Identifier: com.github.eth-its-recipes.pkg.XQuartz
ParentRecipe: com.github.autopkg.download.xquartz
MinimumVersion: 0.2.5

Process:
  - Processor: FlatPkgUnpacker
    Arguments:
      flat_pkg_path: "%pathname%"
      destination_path: "%RECIPE_CACHE_DIR%/unpack"

  - Processor: PkgPayloadUnpacker
    Arguments:
      pkg_payload_path: "%RECIPE_CACHE_DIR%/unpack/XQuartzComponent.pkg/Payload"
      destination_path: "%RECIPE_CACHE_DIR%/payload/"

  - Processor: PlistReader
    Arguments:
      info_path: "%RECIPE_CACHE_DIR%/payload/Applications/Utilities/XQuartz.app"

  - Processor: CodeSignatureVerifier
    Arguments:
      input_path: "%RECIPE_CACHE_DIR%/payload/Applications/Utilities/XQuartz.app"
      comment: Blanking the expected_authority_names value from the parent recipe to prevent errors
      requirement: (identifier "org.xquartz.X11" and anchor apple generic and certificate 1[field.1.2.840.113635.100.6.2.6] /* exists */ and certificate leaf[field.1.2.840.113635.100.6.1.13] /* exists */ and certificate leaf[subject.OU] = NA574AWV7E)
      strict_verification: true
      #expected_authority_names: ""

  - Processor: PkgCopier
    Arguments:
      source_pkg: "%pathname%"
      pkg_path: "%RECIPE_CACHE_DIR%/%NAME%-%version%.pkg"

  - Processor: PathDeleter
    Arguments:
      path_list:
        - "%RECIPE_CACHE_DIR%/unpack"
        - "%RECIPE_CACHE_DIR%/payload"
