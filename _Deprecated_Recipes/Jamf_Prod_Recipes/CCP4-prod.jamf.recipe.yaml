Description: Creates all production policies for a particular title.
Identifier: com.github.eth-its-recipes.jamf.CCP4-prod
MinimumVersion: "2.3"
ParentRecipe: com.github.eth-its-recipes.jamf.template-prod

Input:
  NAME: CCP4
  UNTESTED_RECIPE_IDENTIFIER: local.jamf.CCP4
  TRIGGER_POLICY_TEMPLATE: Policy-prod-triggeronly-script.xml
  EXTENSION_ATTRIBUTE_NAME: "CCP4 version"
  EXTENSION_ATTRIBUTE_SCRIPT: CCP4-EA.zsh
  TEST_VERSION_INSTALLED_GROUP_TEMPLATE: SmartGroup-test-version-installed-EA.xml
  INSTALLED_GROUP_TEMPLATE: SmartGroup-installed-EA.xml
  SCRIPT_PATH: CCP4-postinstall.sh
  SCRIPT_NAME: CCP4-postinstall.sh
  SCRIPT_CATEGORY:  Science & Math
  SCRIPT_PRIORITY: After
  SELFSERVICE_ICON: "%NAME%.png"


